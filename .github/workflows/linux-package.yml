name: Linux Package

# Builds and packages the user-facing glyphwire programs for Linux
# x86_64. The tarball holds exactly what `zig build package` installs:
# glyphwire, gw-shell, glyphwire-notify, glyphwire-demo, gw-view,
# gw-read, gwmd, gw-ls, gw-hist, zoe, gmux, salacommander and gw-agent,
# plus the shared assets, zoe's bundled tree-sitter grammars, and the
# desktop entry and icons. The staging step runs that step against the
# package directory instead of hand-copying binaries, so build.zig stays
# the single place the shipped list lives. The server/client/probe/
# table-demo tools and the test runner are deliberately left out of it.
#
# Windows is intentionally not covered yet: the host needs more work
# before it runs there, and cross-building it wants its own job. When
# that lands, add a `build-windows` job here alongside `build-linux`.

on:
  push:
    branches: [main, dev]
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
  workflow_dispatch:

# `contents: write` is only exercised by the release step on a tag push;
# every other trigger just reads the repo and uploads a run artifact.
permissions:
  contents: write

concurrency:
  group: linux-package-${{ github.ref }}
  # Keep tag/release runs; collapse redundant branch and PR runs.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out glyphwire
        uses: actions/checkout@v4
        with:
          path: glyphwire

      # No system packages are needed to build the host: `host_eng` is
      # in-tree, and the SDL3 dependency vendors its own X11 and Wayland
      # headers and dlopens libX11 / libwayland-client at runtime.

      # Matches build.zig.zon's minimum_zig_version. Nightlies get pruned
      # from ziglang.org and the community mirrors, so this exact dev build
      # is served from our own zig-toolchains releases (setup-zig still
      # verifies the upstream minisign signature).
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.1857+3c46da14d
          mirror: https://github.com/srjilarious/zig-toolchains/releases/download/0.17.0-dev.1857+3c46da14d

      # `zig build package` (defined in build.zig) installs only the shipped
      # programs, assets, grammars and desktop files, skipping the test
      # runner and the internal server/client/table-demo tools. This is the
      # compile gate: the staging step below re-runs the same step with a
      # `--prefix`, which by then is just a file copy.
      #
      # `-Dcpu=baseline` for the same reason provision_remote.lua uses
      # it: a plain `zig build` tunes for the *builder's* exact CPU, and
      # here the builder is whatever machine GitHub handed this run. On
      # an Ice Lake Xeon runner that means AVX-512 (vmovdqu64, vpternlog,
      # kmovd, kortest all appear in the binaries), which dies with
      # "Illegal instruction" on the first one it reaches on any consumer
      # CPU without AVX-512 -- Intel since Alder Lake fuses it off, AMD
      # only has it from Zen 4. Worse, the runner pool is mixed, so the
      # same workflow produces a working tarball or a broken one
      # depending on which machine picked up the run. A downloaded
      # tarball has to run on whatever the downloader has, so baseline is
      # the only safe floor; the cost is nil for the shell/RPC/PTY work
      # and only theoretically visible in gw-view's image decode.
      #
      # The staging step below repeats these flags exactly: a differing
      # set would compile a second full set of artifacts rather than
      # reuse this one, and tar up binaries this step never gated.
      - name: Build (ReleaseSafe)
        working-directory: glyphwire
        run: zig build package -Doptimize=ReleaseSafe -Dcpu=baseline

      # The test runner links `host_eng` too, so this is what catches a
      # backend change that compiles for the host but breaks its input
      # state machines or renames a wire-visible key.
      #
      # `-Dskip-e2e=true` leaves the `e2e` group out of the run: those
      # tests spawn the real gw-shell / gw-ls binaries over real sockets
      # and pty pairs, and they are flaky here -- a run that passes
      # locally failed three of them on the runner. The group is still
      # compiled in, so a break in tests/e2e_tests.zig still fails this
      # step. Drop the flag once the flakiness is fixed.
      - name: Test
        working-directory: glyphwire
        run: zig build tests -Dskip-e2e=true

      # `--prefix` aims the same `package` step at the package directory,
      # so the tarball is what an install of this build produces and the
      # shipped list can't drift from build.zig. The Build step above
      # already compiled these artifacts, so this pass only copies files.
      # Layout mirrors an install prefix: bin/ for commands,
      # share/glyphwire/{assets,grammars}/ for runtime data, and
      # share/{applications,icons}/ for the desktop entry and its icons.
      # The host resolves assets through ../share/glyphwire/assets relative
      # to its executable; zoe resolves grammars through the sibling
      # grammars/ dir.
      - name: Stage package
        working-directory: glyphwire
        run: |
          pkg="glyphwire-linux-x86_64"
          zig build package -Doptimize=ReleaseSafe -Dcpu=baseline --prefix "$PWD/$pkg"
          # The vendored ziglua reaches the Lua C headers by installing
          # liblua.a and its headers into the prefix (libs/ziglua/build.zig
          # hangs its translate-c step off that install), so any build that
          # links Lua drops include/ and lib/ into the prefix. They are a
          # build artefact, not something the shipped programs read, so the
          # tarball drops them.
          rm -rf "$pkg/include" "$pkg/lib"
          cp README.md "$pkg/"
          tar czf "$pkg.tar.gz" "$pkg"
          tar tzf "$pkg.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: glyphwire-linux-x86_64
          path: glyphwire/glyphwire-linux-x86_64.tar.gz
          if-no-files-found: error

      # Only on a vX.Y.Z tag push: attach the same tarball to the GitHub
      # Release for that tag (created if it does not exist yet).
      - name: Attach tarball to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: glyphwire/glyphwire-linux-x86_64.tar.gz
          fail_on_unmatched_files: true
